
name: SetupZombies
version: '1.0.0'
main: com.example.setupzombies.SetupZombiesPlugin
api-version: '1.21'
description: Spawns 100 zombies with /setup

commands:
  setup:
    description: Spawns 100 zombies around the player
    usage: /setup
    permission: setupzombies.use

permissions:
  setupzombies.use:
    description: Allows the player to use /setup
    default: op
